U/3agxBss/70hhoQinlH6B1xnSc2wxCCb/o0ScUdNT6JOl2";
  var KEY_NAME = "tion_note_pw";
  var b64 = function (s) { var r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; };
  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (k) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    });
  }
  function dec(key, buf) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)); }
  function unlock(pw, auto) {
    var m = document.getElementById("m"), b = document.getElementById("b");
    m.className = "msg"; m.textContent = "여는 중…"; b.disabled = true;
    var key;
    derive(pw).then(function (k) { key = k; return dec(k, b64(PAYLOAD)); })
      .then(function (plain) {
        var data = JSON.parse(new TextDecoder().decode(plain));
        try { sessionStorage.setItem(KEY_NAME, pw); } catch (e) {}
        var names = Object.keys(data.assets), done = 0;
        m.textContent = "자료 불러오는 중… 0 / " + names.length;
        return Promise.all(names.map(function (a) {
          var e = data.assets[a];
          return fetch("assets/enc/" + e[0]).then(function (r) { if (!r.ok) throw new Error("asset"); return r.arrayBuffer(); })
            .then(function (buf) { return dec(key, new Uint8Array(buf)); })
            .then(function (p) { done++; m.textContent = "자료 불러오는 중… " + done + " / " + names.length; return [a, URL.createObjectURL(new Blob([p], { type: e[1] }))]; });
        })).then(function (pairs) {
          var html = data.html;
          pairs.sort(function (x, y) { return y[0].length - x[0].length; }).forEach(function (p) { html = html.split(p[0]).join(p[1]); });
          document.open(); document.write(html); document.close();
        });
      })
      .catch(function () {
        try { sessionStorage.removeItem(KEY_NAME); } catch (e) {}
        b.disabled = false;
        if (!auto) { m.className = "msg err"; m.textContent = "비밀번호가 맞지 않습니다."; } else { m.textContent = ""; }
      });
  }
  document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); var v = document.getElementById("pw").value; if (v) unlock(v, false); });
  var saved = null; try { saved = sessionStorage.getItem(KEY_NAME); } catch (e) {}
  if (saved) unlock(saved, true);
