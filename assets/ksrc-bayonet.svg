<svg viewBox="0 0 700 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="소각도 바요넷 체결 과정" style="width:100%;font-family:Inter,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A1A18"/></marker></defs>
<text x="0" y="20" font-size="16" font-weight="700" fill="#1A1A18">소각도 바요넷 체결 과정 — 쿼터턴(90°)이 아닌 약 20° 회전</text>
<g transform="translate(0,0)"><rect x="0" y="40" width="220" height="190" rx="12" fill="#FBFAF7" stroke="#D6D2C8"/><text x="16" y="66" font-size="15" font-weight="700" fill="#1A1A18">① 삽입</text><text x="16" y="86" font-size="12.5" fill="#5C5C52">걸림턱 사이 빈 구간으로 내리기</text><rect x="10" y="196" width="200" height="22" fill="#E3DED4"/><rect x="180" y="128" width="14" height="68" fill="#C0392B"/><text x="187" y="122" text-anchor="middle" font-size="11.5" fill="#C0392B">Stopper</text><rect x="10" y="98" width="148" height="8" rx="2" fill="#B8AFD9"/><rect x="40" y="106" width="38" height="42" fill="#8E86C0"/><rect x="40" y="148" width="38" height="12" fill="#3B3070"/><rect x="100" y="148" width="80" height="14" fill="#E8B4B4" fill-opacity="0.92" stroke="#C0392B"/><path d="M92,112 L92,140" stroke="#1A1A18" stroke-width="2" marker-end="url(#ah)"/></g><g transform="translate(240,0)"><rect x="0" y="40" width="220" height="190" rx="12" fill="#FBFAF7" stroke="#D6D2C8"/><text x="16" y="66" font-size="15" font-weight="700" fill="#1A1A18">② 약 20° 회전</text><text x="16" y="86" font-size="12.5" fill="#5C5C52">러그 발이 걸림턱 아래로 이동</text><rect x="10" y="196" width="200" height="22" fill="#E3DED4"/><rect x="180" y="128" width="14" height="68" fill="#C0392B"/><text x="187" y="122" text-anchor="middle" font-size="11.5" fill="#C0392B">Stopper</text><rect x="10" y="116" width="148" height="8" rx="2" fill="#B8AFD9"/><rect x="92" y="124" width="38" height="42" fill="#8E86C0"/><rect x="92" y="166" width="38" height="12" fill="#3B3070"/><rect x="100" y="148" width="80" height="14" fill="#E8B4B4" fill-opacity="0.92" stroke="#C0392B"/><path d="M62,172 L86,172" stroke="#1A1A18" stroke-width="2" marker-end="url(#ah)"/></g><g transform="translate(480,0)"><rect x="0" y="40" width="220" height="190" rx="12" fill="#FBFAF7" stroke="#D6D2C8"/><text x="16" y="66" font-size="15" font-weight="700" fill="#1A1A18">③ 잠금</text><text x="16" y="86" font-size="12.5" fill="#5C5C52">위로 안 빠지고 Stopper에서 정지</text><rect x="10" y="196" width="200" height="22" fill="#E3DED4"/><rect x="180" y="128" width="14" height="68" fill="#C0392B"/><text x="187" y="122" text-anchor="middle" font-size="11.5" fill="#C0392B">Stopper</text><rect x="10" y="116" width="148" height="8" rx="2" fill="#B8AFD9"/><rect x="142" y="124" width="38" height="42" fill="#8E86C0"/><rect x="142" y="166" width="38" height="12" fill="#3B3070"/><rect x="100" y="148" width="80" height="14" fill="#E8B4B4" fill-opacity="0.92" stroke="#C0392B"/><path d="M60,176 L60,148" stroke="#1A1A18" stroke-width="2" marker-end="url(#ah)"/><text x="68" y="150" font-size="17" font-weight="700" fill="#C0392B">✕</text></g><g transform="translate(0,262)"><rect x="0" y="-11" width="14" height="12" fill="#B8AFD9"/><text x="20" y="0" font-size="12.5" fill="#5C5C52">뚜껑</text><rect x="62" y="-11" width="14" height="12" fill="#3B3070"/><text x="82" y="0" font-size="12.5" fill="#5C5C52">러그 발 (3개, 120° 간격)</text><rect x="250" y="-11" width="14" height="12" fill="#E8B4B4" stroke="#C0392B"/><text x="270" y="0" font-size="12.5" fill="#5C5C52">하우징 걸림턱</text><rect x="370" y="-11" width="14" height="12" fill="#C0392B"/><text x="390" y="0" font-size="12.5" fill="#5C5C52">Stopper</text><text x="700" y="0" text-anchor="end" font-size="12" fill="#8A8A7E">원둘레를 펼쳐 옆에서 본 그림</text></g></svg>