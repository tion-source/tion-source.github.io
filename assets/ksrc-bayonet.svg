<text x="400" y="176" font-size="13" font-weight="700" fill="#1A1A18">체결 동작</text><text x="400" y="196" font-size="13" fill="#1A1A18">① 삽입 — 러그를 턱 사이 빈 구간에 수직으로</text><text x="400" y="220" font-size="13" fill="#1A1A18">② 약 20° 회전 — 러그가 걸림턱 아래로</text><text x="400" y="244" font-size="13" fill="#1A1A18">③ 러그 걸림 — 축 방향 이탈 제한</text><text x="400" y="268" font-size="13" fill="#1A1A18">④ Stopper에서 정지 — 과회전 방지</text>
