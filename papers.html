<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papers — Tion LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F2EC; --card: #EDEAE2;
    --border: #D6D2C8; --text: #1A1A18; --sub: #5C5C52;
    --muted: #8A8A7E; --accent: #2D6A4F; --accent-bg: #EBF4EF;
    --accent-lt: #B7D8C7; --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
  }
  html { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
  .page { max-width: 800px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; margin-bottom: 2rem; transition: color 0.15s; }
  .back:hover { color: var(--accent); }
  .page-header { margin-bottom: 2.5rem; }
  .page-icon { font-size: 36px; margin-bottom: 0.75rem; }
  .page-title { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }
  .page-sub { font-size: 14px; color: var(--sub); }
  .section-label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .empty-state { background: var(--card); border: 1px dashed var(--border); border-radius: 12px; padding: 3rem 2rem; text-align: center; }
  .empty-icon { font-size: 32px; margin-bottom: 1rem; }
  .empty-title { font-family: var(--mono); font-size: 14px; color: var(--sub); margin-bottom: 0.5rem; }
  .empty-sub { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html">← Tion LAB</a>

  <div class="page-header">
    <div class="page-icon">📄</div>
    <div class="page-title">Papers</div>
    <div class="page-sub">Research publications & technical writings</div>
  </div>

  <div class="section-label">Publications</div>

  <div class="empty-state">
    <div class="empty-icon">🔬</div>
    <div class="empty-title">Papers coming soon</div>
    <div class="empty-sub">Research in progress — publications will appear here.</div>
  </div>

</div>
</body>
</html>
